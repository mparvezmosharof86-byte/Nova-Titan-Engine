name: Build Nova Titan Native Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Stable Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Clone & Compile C++ llama-server for Android ARM64
      run: |
        echo "[+] Cloning llama.cpp..."
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git

        echo "[+] Compiling Native C++ Engine with Android NDK..."
        NDK_PATH=$ANDROID_NDK_LATEST_HOME
        cmake -S llama.cpp -B llama.cpp/build-android \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DGGML_OPENMP=OFF \
          -DGGML_LLAMAFILE=OFF

        cmake --build llama.cpp/build-android --config Release --target llama-server -j$(nproc)

    - name: Scaffold Nova Titan Native Project
      run: |
        mkdir -p app/src/main/java/com/novastudio24/titan/engine
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/assets

        # Compile করা আসল C++ ইঞ্জিনকে অ্যাপের assets-এ রাখা
        cp llama.cpp/build-android/bin/llama-server app/src/main/assets/llama-server
        chmod +x app/src/main/assets/llama-server

        # 1. Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Nova Titan Engine"
        include ':app'
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 3. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.novastudio24.titan.engine'
            compileSdk 34

            defaultConfig {
                applicationId "com.novastudio24.titan.engine"
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "2.0.0"
            }

            buildTypes {
                debug {
                    debuggable true
                }
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            // Pure Native Android Framework
        }
        EOF

        # 4. AndroidManifest.xml (Storage & Foreground Service Permissions)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Nova Titan Engine"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. UI Layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1117"
            android:padding="20dp">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="NOVA STUDIO 24"
                android:textColor="#58A6FF"
                android:textSize="13sp"
                android:textStyle="bold" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Nova Titan Native Engine"
                android:textColor="#FFFFFF"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="2dp" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Self-Contained Standalone C++ Engine"
                android:textColor="#8B949E"
                android:textSize="11sp"
                android:layout_marginBottom="16dp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="#161B22"
                android:orientation="vertical"
                android:padding="14dp"
                android:layout_marginBottom="14dp">

                <TextView
                    android:id="@+id/tvEngineStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="ENGINE STATUS: STANDBY"
                    android:textColor="#F0883E"
                    android:textStyle="bold"
                    android:textSize="14sp" />

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Model Source: /sdcard/Download/NovaTitan/"
                    android:textColor="#8B949E"
                    android:textSize="11sp"
                    android:layout_marginTop="4dp" />
            </LinearLayout>

            <Button
                android:id="@+id/btnRun"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="START NATIVE C++ ENGINE"
                android:textColor="#FFFFFF"
                android:textStyle="bold" />

            <ScrollView
                android:id="@+id/scrollLogs"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:background="#010409"
                android:layout_marginTop="14dp">

                <TextView
                    android:id="@+id/tvLogs"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textColor="#7EE787"
                    android:fontFamily="monospace"
                    android:textSize="11sp"
                    android:padding="12dp"
                    android:text="[System] Nova Titan Standalone Engine v2.0 Ready.\n[Storage] Place models in Download/NovaTitan/" />
            </ScrollView>
        </LinearLayout>
        EOF

        # 6. MainActivity.java (Native Process Controller)
        cat << 'EOF' > app/src/main/java/com/novastudio24/titan/engine/MainActivity.java
        package com.novastudio24.titan.engine;

        import android.app.Activity;
        import android.os.Bundle;
        import android.os.Environment;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.ScrollView;
        import android.graphics.Color;
        import java.io.*;

        public class MainActivity extends Activity {
            private boolean isRunning = false;
            private Process nativeProcess;
            private TextView tvLogs, tvEngineStatus;
            private Button btnRun;
            private ScrollView scrollLogs;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                btnRun = findViewById(R.id.btnRun);
                tvLogs = findViewById(R.id.tvLogs);
                tvEngineStatus = findViewById(R.id.tvEngineStatus);
                scrollLogs = findViewById(R.id.scrollLogs);
                btnRun.setBackgroundColor(Color.parseColor("#238636"));

                btnRun.setOnClickListener(v -> {
                    if (!isRunning) {
                        startNativeEngine();
                    } else {
                        stopNativeEngine();
                    }
                });
            }

            private void appendLog(final String text) {
                runOnUiThread(() -> {
                    tvLogs.append("\n" + text);
                    scrollLogs.post(() -> scrollLogs.fullScroll(ScrollView.FOCUS_DOWN));
                });
            }

            private void startNativeEngine() {
                new Thread(() -> {
                    try {
                        File binFile = new File(getFilesDir(), "llama-server");
                        if (!binFile.exists() || binFile.length() == 0) {
                            appendLog("[+] Extracting embedded C++ Engine into App Storage...");
                            InputStream in = getAssets().open("llama-server");
                            FileOutputStream out = new FileOutputStream(binFile);
                            byte[] buffer = new byte[8192];
                            int read;
                            while ((read = in.read(buffer)) != -1) {
                                out.write(buffer, 0, read);
                            }
                            in.close();
                            out.close();
                            binFile.setExecutable(true, false);
                            appendLog("[+] C++ Engine Extracted and Ready!");
                        }

                        // মডেল লোকেশন চেক
                        File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        File modelFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf");
                        
                        // যদি 1.5B না পায়, 7B খুঁজবে
                        if (!modelFile.exists()) {
                            modelFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-7b-instruct-q4_k_m.gguf");
                        }

                        if (!modelFile.exists()) {
                            appendLog("[-] Error: Model file not found in: " + modelFile.getAbsolutePath());
                            appendLog("[!] Please run work 1 (copy model to Download/NovaTitan)");
                            return;
                        }

                        appendLog("[+] Found Model: " + modelFile.getName());
                        appendLog("[+] Launching C++ Engine directly from App on Port 8080...");

                        ProcessBuilder pb = new ProcessBuilder(
                            binFile.getAbsolutePath(),
                            "-m", modelFile.getAbsolutePath(),
                            "-c", "2048",
                            "-b", "128",
                            "-t", "4",
                            "--host", "127.0.0.1",
                            "--port", "8080"
                        );
                        pb.redirectErrorStream(true);
                        nativeProcess = pb.start();
                        isRunning = true;

                        runOnUiThread(() -> {
                            btnRun.setText("STOP NATIVE ENGINE");
                            btnRun.setBackgroundColor(Color.parseColor("#DA3633"));
                            tvEngineStatus.setText("ENGINE STATUS: ONLINE (Port 8080)");
                            tvEngineStatus.setTextColor(Color.parseColor("#3FB950"));
                        });

                        BufferedReader reader = new BufferedReader(new InputStreamReader(nativeProcess.getInputStream()));
                        String line;
                        while ((line = reader.readLine()) != null) {
                            appendLog(line);
                        }

                    } catch (Exception e) {
                        appendLog("[-] Engine Exception: " + e.getMessage());
                        stopNativeEngine();
                    }
                }).start();
            }

            private void stopNativeEngine() {
                if (nativeProcess != null) {
                    nativeProcess.destroy();
                    nativeProcess = null;
                }
                isRunning = false;
                runOnUiThread(() -> {
                    btnRun.setText("START NATIVE C++ ENGINE");
                    btnRun.setBackgroundColor(Color.parseColor("#238636"));
                    tvEngineStatus.setText("ENGINE STATUS: STOPPED");
                    tvEngineStatus.setTextColor(Color.parseColor("#F0883E"));
                    appendLog("[!] Engine Stopped.");
                });
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                stopNativeEngine();
            }
        }
        EOF

    - name: Build Android APK
      run: |
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Titan-Native-Engine-v2
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v2.0.0
        name: "Nova Titan Native Engine v2.0.0"
        body: "All-in-One Standalone C++ Engine APK (Zero Termux Required) by Nova Studio 24."
        files: app/build/outputs/apk/debug/app-debug.apk
