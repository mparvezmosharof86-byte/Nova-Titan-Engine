name: Build Nova Titan Native Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Stable Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Compile C++ Engine & All Shared Libraries
      run: |
        echo "[+] Cloning llama.cpp..."
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git

        echo "[+] Compiling Native Engine with NDK..."
        NDK_PATH=$ANDROID_NDK_LATEST_HOME
        cmake -S llama.cpp -B llama.cpp/build-android \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DGGML_OPENMP=OFF \
          -DGGML_LLAMAFILE=OFF

        cmake --build llama.cpp/build-android --config Release -j$(nproc)

    - name: Scaffold Nova Titan Ultra-Persistent Native Project
      run: |
        mkdir -p app/src/main/java/com/novastudio24/titan/engine
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/jniLibs/arm64-v8a

        # সব .so লাইব্রেরি কপি করা
        find llama.cpp/build-android -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
        cp llama.cpp/build-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libserver.so
        chmod 755 app/src/main/jniLibs/arm64-v8a/*

        # Debug Symbols ছেঁটে সাইজ ছোট করা (OutOfMemory Fix)
        NDK_STRIP="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
        find app/src/main/jniLibs -name "*.so" -exec $NDK_STRIP --strip-unneeded {} + || true

        # 1. Gradle Properties (৪ জিবি র‍্যাম বরাদ্দ)
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        android.useAndroidX=true
        EOF

        # 2. Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Nova Titan Engine"
        include ':app'
        EOF

        # 3. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 4. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.novastudio24.titan.engine'
            compileSdk 34

            defaultConfig {
                applicationId "com.novastudio24.titan.engine"
                minSdk 24
                targetSdk 34
                versionCode 7
                versionName "3.0.2"
                ndk {
                    abiFilters 'arm64-v8a'
                }
            }

            packagingOptions {
                jniLibs {
                    useLegacyPackaging = true
                }
            }

            buildTypes {
                debug {
                    debuggable true
                }
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            // Pure Native Android
        }
        EOF

        # 5. AndroidManifest.xml (Super-Strong 24/7 Permissions)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

            <application
                android:allowBackup="true"
                android:extractNativeLibs="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Nova Titan Engine"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".EngineService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="dataSync" />
            </application>
        </manifest>
        EOF

        # 6. UI Layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1117"
            android:padding="20dp">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="NOVA STUDIO 24"
                android:textColor="#58A6FF"
                android:textSize="13sp"
                android:textStyle="bold" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Nova Titan Native Engine"
                android:textColor="#FFFFFF"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="2dp" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="24/7 Persistent Native Engine v3.0"
                android:textColor="#8B949E"
                android:textSize="11sp"
                android:layout_marginBottom="16dp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="#161B22"
                android:orientation="vertical"
                android:padding="14dp"
                android:layout_marginBottom="14dp">

                <TextView
                    android:id="@+id/tvEngineStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="ENGINE STATUS: STANDBY"
                    android:textColor="#F0883E"
                    android:textStyle="bold"
                    android:textSize="14sp" />

                <TextView
                    android:id="@+id/tvModelPath"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Source: /sdcard/Download/NovaTitan/"
                    android:textColor="#8B949E"
                    android:textSize="11sp"
                    android:layout_marginTop="4dp" />
            </LinearLayout>

            <Button
                android:id="@+id/btnRun"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="START 24/7 NATIVE ENGINE"
                android:textColor="#FFFFFF"
                android:textStyle="bold" />

            <ScrollView
                android:id="@+id/scrollLogs"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:background="#010409"
                android:layout_marginTop="14dp">

                <TextView
                    android:id="@+id/tvLogs"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textColor="#7EE787"
                    android:fontFamily="monospace"
                    android:textSize="11sp"
                    android:padding="12dp"
                    android:text="[System] Nova Titan v3.0 Armed.\n[Status] Notification Bar &amp; WakeLock Enabled." />
            </ScrollView>
        </LinearLayout>
        EOF

        # 7. EngineService.java
        cat << 'EOF' > app/src/main/java/com/novastudio24/titan/engine/EngineService.java
        package com.novastudio24.titan.engine;

        import android.app.*;
        import android.content.Intent;
        import android.content.pm.ServiceInfo;
        import android.os.Build;
        import android.os.Environment;
        import android.os.IBinder;
        import android.os.PowerManager;
        import java.io.*;

        public class EngineService extends Service {
            private static final String CHANNEL_ID = "nova_titan_engine_channel";
            private java.lang.Process nativeProcess;
            private PowerManager.WakeLock wakeLock;

            public interface LogCallback {
                void onLog(String log);
            }
            public static LogCallback logCallback;
            public static boolean isServiceRunning = false;

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                isServiceRunning = true;

                Intent notifIntent = new Intent(this, MainActivity.class);
                PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, notifIntent, PendingIntent.FLAG_IMMUTABLE);

                Notification notification = new Notification.Builder(this, CHANNEL_ID)
                        .setContentTitle("Nova Titan Engine is ACTIVE")
                        .setContentText("Local AI Server Listening on Port 8080 (24/7)")
                        .setSmallIcon(android.R.drawable.stat_notify_sync)
                        .setContentIntent(pendingIntent)
                        .setOngoing(true)
                        .build();

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                } else {
                    startForeground(1001, notification);
                }

                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (pm != null) {
                    wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "NovaTitan:EngineWakeLock");
                    wakeLock.acquire();
                }

                startEngineProcess();
                return START_STICKY;
            }

            private void startEngineProcess() {
                new Thread(() -> {
                    try {
                        String nativeLibDir = getApplicationInfo().nativeLibraryDir;
                        File binFile = new File(nativeLibDir, "libserver.so");

                        File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        File modelFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf");
                        if (!modelFile.exists()) {
                            modelFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-7b-instruct-q4_k_m.gguf");
                        }

                        if (!modelFile.exists()) {
                            if (logCallback != null) logCallback.onLog("[-] Model not found in /sdcard/Download/NovaTitan/");
                            return;
                        }

                        if (logCallback != null) {
                            logCallback.onLog("[+] Found Model: " + modelFile.getName());
                            logCallback.onLog("[+] Launching 24/7 Engine on Port 8080...");
                        }

                        ProcessBuilder pb = new ProcessBuilder(
                            binFile.getAbsolutePath(),
                            "-m", modelFile.getAbsolutePath(),
                            "-c", "2048",
                            "-b", "128",
                            "-t", "4",
                            "--host", "127.0.0.1",
                            "--port", "8080"
                        );

                        pb.environment().put("LD_LIBRARY_PATH", nativeLibDir);
                        pb.redirectErrorStream(true);
                        nativeProcess = pb.start();

                        BufferedReader reader = new BufferedReader(new InputStreamReader(nativeProcess.getInputStream()));
                        String line;
                        while ((line = reader.readLine()) != null) {
                            if (logCallback != null) logCallback.onLog(line);
                        }

                    } catch (Exception e) {
                        if (logCallback != null) logCallback.onLog("[-] Engine Exception: " + e.getMessage());
                    }
                }).start();
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                isServiceRunning = false;
                if (nativeProcess != null) {
                    nativeProcess.destroy();
                }
                if (wakeLock != null && wakeLock.isHeld()) {
                    wakeLock.release();
                }
                stopForeground(true);
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void createNotificationChannel() {
                NotificationChannel channel = new NotificationChannel(
                        CHANNEL_ID,
                        "Nova Titan Background Engine",
                        NotificationManager.IMPORTANCE_LOW
                );
                channel.setDescription("Keeps the AI Engine running continuously in the background.");
                NotificationManager manager = getSystemService(NotificationManager.class);
                if (manager != null) {
                    manager.createNotificationChannel(channel);
                }
            }
        }
        EOF

        # 8. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/novastudio24/titan/engine/MainActivity.java
        package com.novastudio24.titan.engine;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.ScrollView;
        import android.graphics.Color;

        public class MainActivity extends Activity {
            private TextView tvLogs, tvEngineStatus;
            private Button btnRun;
            private ScrollView scrollLogs;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                btnRun = findViewById(R.id.btnRun);
                tvLogs = findViewById(R.id.tvLogs);
                tvEngineStatus = findViewById(R.id.tvEngineStatus);
                scrollLogs = findViewById(R.id.scrollLogs);

                updateUIState(EngineService.isServiceRunning);

                EngineService.logCallback = text -> runOnUiThread(() -> {
                    tvLogs.append("\n" + text);
                    scrollLogs.post(() -> scrollLogs.fullScroll(ScrollView.FOCUS_DOWN));
                });

                btnRun.setOnClickListener(v -> {
                    if (!EngineService.isServiceRunning) {
                        Intent serviceIntent = new Intent(this, EngineService.class);
                        startForegroundService(serviceIntent);
                        updateUIState(true);
                    } else {
                        Intent serviceIntent = new Intent(this, EngineService.class);
                        stopService(serviceIntent);
                        updateUIState(false);
                    }
                });
            }

            private void updateUIState(boolean isRunning) {
                if (isRunning) {
                    btnRun.setText("STOP 24/7 NATIVE ENGINE");
                    btnRun.setBackgroundColor(Color.parseColor("#DA3633"));
                    tvEngineStatus.setText("ENGINE STATUS: 24/7 ACTIVE (Port 8080)");
                    tvEngineStatus.setTextColor(Color.parseColor("#3FB950"));
                } else {
                    btnRun.setText("START 24/7 NATIVE ENGINE");
                    btnRun.setBackgroundColor(Color.parseColor("#238636"));
                    tvEngineStatus.setText("ENGINE STATUS: STOPPED");
                    tvEngineStatus.setTextColor(Color.parseColor("#F0883E"));
                }
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                EngineService.logCallback = null;
            }
        }
        EOF

    - name: Build Android APK
      run: |
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Titan-Native-Engine-v3.0.2
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v3.0.2
        name: "Nova Titan Native Engine v3.0.2"
        body: "Optimized Strip & 4GB Heap 24/7 Engine APK by Nova Studio 24."
        files: app/build/outputs/apk/debug/app-debug.apk
