name: Build Nova Titan Master Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Stable Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Compile C++ Engine & All Shared Libraries
      run: |
        echo "[+] Cloning llama.cpp..."
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git

        echo "[+] Compiling Native Engine with NDK..."
        NDK_PATH=$ANDROID_NDK_LATEST_HOME
        cmake -S llama.cpp -B llama.cpp/build-android \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DGGML_OPENMP=OFF \
          -DGGML_LLAMAFILE=OFF

        cmake --build llama.cpp/build-android --config Release --target llama-server -j$(nproc)

    - name: Scaffold Nova Titan Master Project
      run: |
        mkdir -p app/src/main/java/com/novastudio24/titan/engine
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/jniLibs/arm64-v8a

        find llama.cpp/build-android -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
        cp llama.cpp/build-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libserver.so
        chmod 755 app/src/main/jniLibs/arm64-v8a/*

        NDK_STRIP="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
        find app/src/main/jniLibs -name "*.so" -exec $NDK_STRIP --strip-unneeded {} + || true

        # 1. Gradle Properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        android.useAndroidX=true
        EOF

        # 2. Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Nova Titan Engine"
        include ':app'
        EOF

        # 3. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 4. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.novastudio24.titan.engine'
            compileSdk 34

            defaultConfig {
                applicationId "com.novastudio24.titan.engine"
                minSdk 24
                targetSdk 34
                versionCode 11
                versionName "4.1.0"
                ndk {
                    abiFilters 'arm64-v8a'
                }
            }

            packagingOptions {
                jniLibs {
                    useLegacyPackaging = true
                }
            }

            buildTypes {
                debug {
                    debuggable true
                }
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            // Pure Native Android Framework
        }
        EOF

        # 5. AndroidManifest.xml (usesCleartextTraffic Enabled)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
            
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

            <application
                android:allowBackup="true"
                android:extractNativeLibs="true"
                android:requestLegacyExternalStorage="true"
                android:usesCleartextTraffic="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Nova Titan Engine"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".EngineService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="dataSync" />
            </application>
        </manifest>
        EOF

        # 6. UI Layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1117"
            android:padding="20dp">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="NOVA STUDIO 24"
                android:textColor="#58A6FF"
                android:textSize="13sp"
                android:textStyle="bold" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Nova Titan Master Engine"
                android:textColor="#FFFFFF"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="2dp" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="v4.1.0 • Cleartext HTTP &amp; Firebase 24/7"
                android:textColor="#8B949E"
                android:textSize="11sp"
                android:layout_marginBottom="14dp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="#161B22"
                android:orientation="vertical"
                android:padding="14dp"
                android:layout_marginBottom="12dp">

                <TextView
                    android:id="@+id/tvEngineStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="ENGINE STATUS: STANDBY"
                    android:textColor="#F0883E"
                    android:textStyle="bold"
                    android:textSize="14sp" />

                <TextView
                    android:id="@+id/tvModelPath"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Firebase: nova-studio-24-default-rtdb"
                    android:textColor="#8B949E"
                    android:textSize="11sp"
                    android:layout_marginTop="3dp" />

                <ProgressBar
                    android:id="@+id/downloadProgressBar"
                    style="?android:attr/progressBarStyleHorizontal"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:visibility="gone"
                    android:layout_marginTop="10dp"
                    android:max="100" />

                <TextView
                    android:id="@+id/tvDownloadStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Checking models..."
                    android:textColor="#58A6FF"
                    android:textSize="12sp"
                    android:visibility="gone"
                    android:layout_marginTop="4dp" />
            </LinearLayout>

            <Button
                android:id="@+id/btnRun"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="START 24/7 NATIVE ENGINE"
                android:textColor="#FFFFFF"
                android:textStyle="bold" />

            <Button
                android:id="@+id/btnDownloadModels"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="DOWNLOAD / SYNC BOTH MODELS"
                android:textColor="#FFFFFF"
                android:backgroundTint="#21262D"
                android:layout_marginTop="6dp" />

            <ScrollView
                android:id="@+id/scrollLogs"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:background="#010409"
                android:layout_marginTop="12dp">

                <TextView
                    android:id="@+id/tvLogs"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textColor="#7EE787"
                    android:fontFamily="monospace"
                    android:textSize="11sp"
                    android:padding="12dp"
                    android:text="[System] Nova Titan Master Engine v4.1.0 Armed.\n[Cleartext] Localhost Loopback Allowed." />
            </ScrollView>
        </LinearLayout>
        EOF

        # 7. EngineService.java
        cat << 'EOF' > app/src/main/java/com/novastudio24/titan/engine/EngineService.java
        package com.novastudio24.titan.engine;

        import android.app.*;
        import android.content.Intent;
        import android.content.pm.ServiceInfo;
        import android.os.Build;
        import android.os.Environment;
        import android.os.IBinder;
        import android.os.PowerManager;
        import java.io.*;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.Iterator;
        import org.json.JSONArray;
        import org.json.JSONObject;

        public class EngineService extends Service {
            private static final String CHANNEL_ID = "nova_titan_engine_channel";
            private static final String FIREBASE_URL = "https://nova-studio-24-default-rtdb.firebaseio.com";
            
            private java.lang.Process nativeProcess;
            private PowerManager.WakeLock wakeLock;

            public interface LogCallback {
                void onLog(String log);
            }
            public static LogCallback logCallback;
            public static boolean isServiceRunning = false;

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                isServiceRunning = true;

                Intent notifIntent = new Intent(this, MainActivity.class);
                PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, notifIntent, PendingIntent.FLAG_IMMUTABLE);

                Notification notification = new Notification.Builder(this, CHANNEL_ID)
                        .setContentTitle("Nova Titan Engine is ACTIVE")
                        .setContentText("Local AI Engine & Firebase Bridge Running 24/7")
                        .setSmallIcon(android.R.drawable.stat_notify_sync)
                        .setContentIntent(pendingIntent)
                        .setOngoing(true)
                        .build();

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                } else {
                    startForeground(1001, notification);
                }

                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (pm != null) {
                    wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "NovaTitan:EngineWakeLock");
                    wakeLock.acquire();
                }

                startEngineProcess();
                startFirebaseBridgeListener();
                return START_STICKY;
            }

            private void startEngineProcess() {
                new Thread(() -> {
                    try {
                        String nativeLibDir = getApplicationInfo().nativeLibraryDir;
                        File binFile = new File(nativeLibDir, "libserver.so");

                        File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        File modelFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf");
                        if (!modelFile.exists()) {
                            modelFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-7b-instruct-q4_k_m.gguf");
                        }

                        if (!modelFile.exists()) {
                            if (logCallback != null) logCallback.onLog("[-] Model not found! Please tap 'Download / Sync Both Models'");
                            return;
                        }

                        if (logCallback != null) {
                            logCallback.onLog("[+] Found Model: " + modelFile.getName());
                            logCallback.onLog("[+] Launching 24/7 Engine on Port 8080...");
                        }

                        ProcessBuilder pb = new ProcessBuilder(
                            binFile.getAbsolutePath(),
                            "-m", modelFile.getAbsolutePath(),
                            "-c", "2048",
                            "-b", "128",
                            "-t", "4",
                            "--host", "127.0.0.1",
                            "--port", "8080"
                        );

                        pb.environment().put("LD_LIBRARY_PATH", nativeLibDir);
                        pb.redirectErrorStream(true);
                        nativeProcess = pb.start();

                        BufferedReader reader = new BufferedReader(new InputStreamReader(nativeProcess.getInputStream()));
                        String line;
                        while ((line = reader.readLine()) != null) {
                            if (logCallback != null) logCallback.onLog(line);
                        }

                    } catch (Exception e) {
                        if (logCallback != null) logCallback.onLog("[-] Engine Exception: " + e.getMessage());
                    }
                }).start();
            }

            private void startFirebaseBridgeListener() {
                new Thread(() -> {
                    try {
                        Thread.sleep(4000);
                    } catch (InterruptedException ignored) {}

                    if (logCallback != null) logCallback.onLog("[Firebase] Connected to Database! Actively listening...");

                    while (isServiceRunning) {
                        try {
                            URL url = new URL(FIREBASE_URL + "/requests/pending.json");
                            HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                            conn.setRequestMethod("GET");
                            conn.setConnectTimeout(6000);
                            conn.setReadTimeout(6000);

                            if (conn.getResponseCode() == 200) {
                                BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                StringBuilder sb = new StringBuilder();
                                String l;
                                while ((l = br.readLine()) != null) sb.append(l);
                                br.close();

                                String resText = sb.toString().trim();
                                if (!resText.equals("null") && !resText.isEmpty()) {
                                    JSONObject pendingList = new JSONObject(resText);
                                    Iterator<String> keys = pendingList.keys();

                                    while (keys.hasNext()) {
                                        String reqId = keys.next();
                                        JSONObject reqObj = pendingList.getJSONObject(reqId);
                                        String userId = reqObj.optString("user_id", "anonymous");
                                        String prompt = reqObj.optString("prompt", "");

                                        if (logCallback != null) logCallback.onLog("[Firebase] Query from " + userId + ": " + prompt);

                                        String aiCode = callLocalAiEngine(prompt);

                                        JSONObject completed = new JSONObject();
                                        completed.put("user_id", userId);
                                        completed.put("response", aiCode);
                                        completed.put("status", "done");
                                        completed.put("timestamp", System.currentTimeMillis() / 1000);

                                        URL putUrl = new URL(FIREBASE_URL + "/requests/completed/" + reqId + ".json");
                                        HttpURLConnection putConn = (HttpURLConnection) putUrl.openConnection();
                                        putConn.setRequestMethod("PUT");
                                        putConn.setDoOutput(true);
                                        putConn.setRequestProperty("Content-Type", "application/json");
                                        OutputStream os = putConn.getOutputStream();
                                        os.write(completed.toString().getBytes("UTF-8"));
                                        os.close();
                                        putConn.getResponseCode();
                                        putConn.disconnect();

                                        URL delUrl = new URL(FIREBASE_URL + "/requests/pending/" + reqId + ".json");
                                        HttpURLConnection delConn = (HttpURLConnection) delUrl.openConnection();
                                        delConn.setRequestMethod("DELETE");
                                        delConn.getResponseCode();
                                        delConn.disconnect();

                                        if (logCallback != null) logCallback.onLog("[Firebase] Completed & sent back: " + reqId);
                                    }
                                }
                            }
                            conn.disconnect();

                        } catch (Exception ignored) {}

                        try {
                            Thread.sleep(1500);
                        } catch (InterruptedException ignored) {}
                    }
                }).start();
            }

            private String callLocalAiEngine(String userPrompt) {
                try {
                    URL url = new URL("http://127.0.0.1:8080/v1/chat/completions");
                    HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                    conn.setRequestMethod("POST");
                    conn.setRequestProperty("Content-Type", "application/json");
                    conn.setDoOutput(true);
                    conn.setConnectTimeout(8000);
                    conn.setReadTimeout(120000);

                    JSONObject payload = new JSONObject();
                    payload.put("model", "qwen2.5-coder");
                    payload.put("temperature", 0.2);
                    payload.put("max_tokens", 2048);

                    JSONArray messages = new JSONArray();
                    JSONObject sys = new JSONObject();
                    sys.put("role", "system");
                    sys.put("content", "You are Nova Titan Coder by Nova Studio 24. Always write clean, production-ready code and explain game/app logic.");
                    messages.put(sys);

                    JSONObject user = new JSONObject();
                    user.put("role", "user");
                    user.put("content", userPrompt);
                    messages.put(user);

                    payload.put("messages", messages);

                    OutputStream os = conn.getOutputStream();
                    os.write(payload.toString().getBytes("UTF-8"));
                    os.close();

                    if (conn.getResponseCode() == 200) {
                        BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                        StringBuilder sb = new StringBuilder();
                        String l;
                        while ((l = br.readLine()) != null) sb.append(l);
                        br.close();
                        JSONObject res = new JSONObject(sb.toString());
                        return res.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content");
                    }
                } catch (Exception e) {
                    return "Engine Error: " + e.getMessage();
                }
                return "Error: Local Engine didn't return output.";
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                isServiceRunning = false;
                if (nativeProcess != null) {
                    nativeProcess.destroy();
                }
                if (wakeLock != null && wakeLock.isHeld()) {
                    wakeLock.release();
                }
                stopForeground(true);
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void createNotificationChannel() {
                NotificationChannel channel = new NotificationChannel(
                        CHANNEL_ID,
                        "Nova Titan Background Engine",
                        NotificationManager.IMPORTANCE_LOW
                );
                channel.setDescription("Keeps the AI Engine running continuously in the background.");
                NotificationManager manager = getSystemService(NotificationManager.class);
                if (manager != null) {
                    manager.createNotificationChannel(channel);
                }
            }
        }
        EOF

        # 8. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/novastudio24/titan/engine/MainActivity.java
        package com.novastudio24.titan.engine;

        import android.app.Activity;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Environment;
        import android.provider.Settings;
        import android.view.View;
        import android.widget.Button;
        import android.widget.ProgressBar;
        import android.widget.TextView;
        import android.widget.ScrollView;
        import android.graphics.Color;
        import java.io.*;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class MainActivity extends Activity {
            private TextView tvLogs, tvEngineStatus, tvDownloadStatus;
            private Button btnRun, btnDownloadModels;
            private ProgressBar downloadProgressBar;
            private ScrollView scrollLogs;
            private boolean isDownloading = false;

            private static final String MODEL_SPARK_URL = "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf";
            private static final String MODEL_TITAN_URL = "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                btnRun = findViewById(R.id.btnRun);
                btnDownloadModels = findViewById(R.id.btnDownloadModels);
                tvLogs = findViewById(R.id.tvLogs);
                tvEngineStatus = findViewById(R.id.tvEngineStatus);
                tvDownloadStatus = findViewById(R.id.tvDownloadStatus);
                downloadProgressBar = findViewById(R.id.downloadProgressBar);
                scrollLogs = findViewById(R.id.scrollLogs);

                checkAndRequestAllFilesPermission();
                checkExistingModels();
                updateUIState(EngineService.isServiceRunning);

                EngineService.logCallback = text -> runOnUiThread(() -> {
                    tvLogs.append("\n" + text);
                    scrollLogs.post(() -> scrollLogs.fullScroll(ScrollView.FOCUS_DOWN));
                });

                btnRun.setOnClickListener(v -> {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !Environment.isExternalStorageManager()) {
                        tvLogs.append("\n[!] Please grant 'All files access' in settings!");
                        checkAndRequestAllFilesPermission();
                        return;
                    }

                    if (!EngineService.isServiceRunning) {
                        Intent serviceIntent = new Intent(this, EngineService.class);
                        startForegroundService(serviceIntent);
                        updateUIState(true);
                    } else {
                        Intent serviceIntent = new Intent(this, EngineService.class);
                        stopService(serviceIntent);
                        updateUIState(false);
                    }
                });

                btnDownloadModels.setOnClickListener(v -> {
                    if (!isDownloading) {
                        startDownloadBothModels();
                    }
                });
            }

            private void checkExistingModels() {
                File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                File sparkFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf");
                File titanFile = new File(downloadDir, "NovaTitan/qwen2.5-coder-7b-instruct-q4_k_m.gguf");

                if (sparkFile.exists() && titanFile.exists()) {
                    tvLogs.append("\n[+] Both Nova Spark (1.5B) & Nova Titan (7B) detected!");
                } else if (sparkFile.exists()) {
                    tvLogs.append("\n[+] Nova Spark (1.5B) detected! (7B missing)");
                } else {
                    tvLogs.append("\n[!] Models missing! Tap 'Download / Sync Both Models' to download.");
                }
            }

            private void startDownloadBothModels() {
                isDownloading = true;
                downloadProgressBar.setVisibility(View.VISIBLE);
                tvDownloadStatus.setVisibility(View.VISIBLE);
                btnDownloadModels.setEnabled(false);

                new Thread(() -> {
                    File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                    File dir = new File(downloadDir, "NovaTitan");
                    if (!dir.exists()) dir.mkdirs();

                    File sparkFile = new File(dir, "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf");
                    File titanFile = new File(dir, "qwen2.5-coder-7b-instruct-q4_k_m.gguf");

                    if (!sparkFile.exists()) {
                        downloadSingleModel("Nova Spark (1.5B)", MODEL_SPARK_URL, sparkFile);
                    } else {
                        runOnUiThread(() -> tvLogs.append("\n[+] Model 1: Nova Spark already downloaded!"));
                    }

                    if (!titanFile.exists()) {
                        downloadSingleModel("Nova Titan (7B)", MODEL_TITAN_URL, titanFile);
                    } else {
                        runOnUiThread(() -> tvLogs.append("\n[+] Model 2: Nova Titan already downloaded!"));
                    }

                    runOnUiThread(() -> {
                        isDownloading = false;
                        downloadProgressBar.setVisibility(View.GONE);
                        tvDownloadStatus.setText("All Models Ready!");
                        btnDownloadModels.setEnabled(true);
                        tvLogs.append("\n[SUCCESS] Both AI Models are 100% Ready in Storage!");
                    });
                }).start();
            }

            private void downloadSingleModel(String modelName, String downloadUrl, File outputFile) {
                try {
                    runOnUiThread(() -> tvLogs.append("\n[+] Downloading " + modelName + " directly from Cloud..."));
                    URL url = new URL(downloadUrl);
                    HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                    conn.setInstanceFollowRedirects(true);
                    conn.connect();

                    int responseCode = conn.getResponseCode();
                    if (responseCode == HttpURLConnection.HTTP_MOVED_PERM || responseCode == HttpURLConnection.HTTP_MOVED_TEMP || responseCode == 307 || responseCode == 308) {
                        String newUrl = conn.getHeaderField("Location");
                        conn = (HttpURLConnection) new URL(newUrl).openConnection();
                        conn.connect();
                    }

                    int fileLength = conn.getContentLength();
                    InputStream input = new BufferedInputStream(conn.getInputStream());
                    OutputStream output = new FileOutputStream(outputFile);

                    byte[] data = new byte[8192];
                    long total = 0;
                    int count;

                    while ((count = input.read(data)) != -1) {
                        total += count;
                        if (fileLength > 0) {
                            final int progress = (int) (total * 100 / fileLength);
                            final long totalMB = total / (1024 * 1024);
                            final long fileLengthMB = fileLength / (1024 * 1024);
                            runOnUiThread(() -> {
                                downloadProgressBar.setProgress(progress);
                                tvDownloadStatus.setText(modelName + ": " + totalMB + "MB / " + fileLengthMB + "MB (" + progress + "%)");
                            });
                        }
                        output.write(data, 0, count);
                    }

                    output.flush();
                    output.close();
                    input.close();
                    conn.disconnect();

                    runOnUiThread(() -> tvLogs.append("\n[✔] " + modelName + " Download Complete!"));

                } catch (Exception e) {
                    runOnUiThread(() -> tvLogs.append("\n[-] Download Error for " + modelName + ": " + e.getMessage()));
                }
            }

            private void checkAndRequestAllFilesPermission() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                    if (!Environment.isExternalStorageManager()) {
                        try {
                            Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                            intent.setData(Uri.parse("package:" + getPackageName()));
                            startActivity(intent);
                        } catch (Exception e) {
                            Intent intent = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                            startActivity(intent);
                        }
                    }
                }
            }

            private void updateUIState(boolean isRunning) {
                if (isRunning) {
                    btnRun.setText("STOP 24/7 NATIVE ENGINE");
                    btnRun.setBackgroundColor(Color.parseColor("#DA3633"));
                    tvEngineStatus.setText("ENGINE STATUS: 24/7 ACTIVE (Port 8080)");
                    tvEngineStatus.setTextColor(Color.parseColor("#3FB950"));
                } else {
                    btnRun.setText("START 24/7 NATIVE ENGINE");
                    btnRun.setBackgroundColor(Color.parseColor("#238636"));
                    tvEngineStatus.setText("ENGINE STATUS: STOPPED");
                    tvEngineStatus.setTextColor(Color.parseColor("#F0883E"));
                }
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                EngineService.logCallback = null;
            }
        }
        EOF

